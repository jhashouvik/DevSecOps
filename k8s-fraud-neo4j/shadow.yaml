apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "fraud-predictor-shadow"
  namespace: default
spec:
  predictor:
    serviceAccountName: sa-s3-access
    labels:
      app: mlserver
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8082"
      prometheus.io/path: "/metrics"
    model:
      modelFormat:
        name: mlflow
      protocolVersion: v2
      storageUri: "s3://wezvatech-fraud-model/2/models/m-e6ed0b307ab74f4fb333aa75dd04dff0/artifacts"
      env:
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: neo4j_host
        - name: NEO4J_USER
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: neo4j_user
        - name: NEO4J_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: neo4j_passwd
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: kafka_brokers
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: kafka_topic
        - name: KAFKA_CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: kafka_consumer_group
        - name: VALKEY_HOST
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: VALKEY_HOST
        - name: VALKEY_PORT
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: VALKEY_PORT
        - name: VALKEY_DB
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: VALKEY_DB
        - name: VALKEY_TLS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: wezvamlopscm-shadow
              key: VALKEY_TLS_ENABLED
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wezvamlopscm-shadow
data:
  KAFKA_BROKERS: "kafka-cluster-kafka-bootstrap.kafka:9098"
  KAFKA_TOPIC: "fraud-shadow"                 # Isolate the queue topic
  KAFKA_CONSUMER_GROUP: "python-shadow-group" # Isolate the consumer tracking

  VALKEY_HOST: wezvatechdev.tautdjz.mongodb.net
  VALKEY_PORT: "6379"
  VALKEY_DB: "1"                              # Use DB 1 instead of DB 0 to isolate cache keys
  VALKEY_TLS_ENABLED: "YourSecurePassword123"

  NEO4J_URI: "bolt://neo4jshadow-svc.default.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "false"

  # Kafka
  kafka_brokers: "kafka-cluster-kafka-bootstrap.kafka:9098"
  kafka_topic: "fraud"
  kafka_consumer_group: "python-group"

  # Valkey
  VALKEY_HOST: "valkey-primary.demo.svc.cluster.local"
  VALKEY_PORT: "6379"
  VALKEY_DB: "0"
  VALKEY_TLS_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: neo4jshadow-svc
spec:
  type: ExternalName
  # Points directly to the AWS Network Load Balancer (NLB) for Neo4j Shadow
  externalName: wezvatechdev-neo4jshadow-nlb-1234567890.elb.us-east-1.amazonaws.com
      
