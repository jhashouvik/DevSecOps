apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    serving.kserve.io/s3-secret-uuid: "true"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
  AWS_DEFAULT_REGION: {{ .Values.aws.region | quote }}

