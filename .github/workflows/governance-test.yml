name: Test Macie & Comprehend Governance

on:
  workflow_dispatch:
    inputs:
      raw_ingestion_bucket_id:
        description: Data lake bucket name the governance pipeline was deployed against
        required: true
        type: string
      environment:
        description: Environment prefix used at deploy time (matches the Terraform "environment" variable)
        required: true
        default: production
        type: string
      test_comprehend:
        description: Upload a test file and verify the PII gateway redacts it exactly once
        required: true
        default: true
        type: boolean
      test_macie:
        description: Run a one-time Macie classification job and verify it finds PII
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-governance-test
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  BUCKET: ${{ inputs.raw_ingestion_bucket_id }}

jobs:
  test:
    name: Test Governance Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize inputs
        run: |
          echo "BUCKET=$(echo -n "$BUCKET" | xargs)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show target AWS account
        run: aws sts get-caller-identity

      - name: Set run tag
        run: echo "RUN_TAG=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Comprehend PII Gateway: upload under raw/, confirm exactly one
      # redacted copy appears under processed/, and confirm the Lambda did
      # not retrigger itself (the recursion bug this pipeline was fixed for).
      # ---------------------------------------------------------------------
      - name: "Comprehend: upload raw test object"
        if: inputs.test_comprehend
        run: |
          RAW_KEY="raw/pii_test-${RUN_TAG}.csv"
          echo "RAW_KEY=${RAW_KEY}" >> "$GITHUB_ENV"
          echo "PROCESSED_KEY=processed/pii_test-${RUN_TAG}.csv" >> "$GITHUB_ENV"
          echo "START_TIME_MS=$(($(date +%s) * 1000))" >> "$GITHUB_ENV"
          aws s3 cp terraform-modules/comprehend-PII-gateway/pii_test.csv "s3://${BUCKET}/${RAW_KEY}"
          echo "Uploaded s3://${BUCKET}/${RAW_KEY}"

      - name: "Comprehend: wait for redacted output"
        if: inputs.test_comprehend
        run: |
          for attempt in $(seq 1 18); do
            if aws s3api head-object --bucket "$BUCKET" --key "$PROCESSED_KEY" >/dev/null 2>&1; then
              echo "Found processed object after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: processed object not ready yet, waiting 5s..."
            sleep 5
          done
          echo "::error::Timed out waiting for s3://${BUCKET}/${PROCESSED_KEY}. Check the Lambda's CloudWatch logs."
          exit 1

      - name: "Comprehend: verify PII was redacted"
        if: inputs.test_comprehend
        run: |
          aws s3 cp "s3://${BUCKET}/${PROCESSED_KEY}" processed_output.csv
          echo "--- processed output ---"
          cat processed_output.csv
          if grep -q "REDACTED" processed_output.csv && ! grep -qE "@wezvatech\.internal|\+91-9739110917" processed_output.csv; then
            echo "PASS: PII fixture values were redacted."
          else
            echo "::error::Processed object still contains raw PII, or no redaction markers were found."
            exit 1
          fi

      - name: "Comprehend: verify no self-retrigger loop"
        if: inputs.test_comprehend
        run: |
          LOG_GROUP="/aws/lambda/${{ inputs.environment }}-central-pii-gateway-worker"
          MATCHES=0
          for attempt in $(seq 1 12); do
            MATCHES=$(aws logs filter-log-events \
              --no-paginate \
              --log-group-name "$LOG_GROUP" \
              --start-time "$START_TIME_MS" \
              --filter-pattern "\"s3://${BUCKET}/${RAW_KEY}\"" \
              --query 'length(events)' --output text 2>/dev/null || echo "0")
            echo "Attempt ${attempt}: matching invocation log lines for ${RAW_KEY}: ${MATCHES}"
            if [ "$MATCHES" -ge 1 ]; then
              break
            fi
            sleep 5
          done
          if [ "$MATCHES" -eq 1 ]; then
            echo "PASS: exactly one invocation processed the raw object."
          elif [ "$MATCHES" -eq 0 ]; then
            echo "::error::No invocation log found for ${RAW_KEY} after retries. Either CloudWatch Logs is still indexing, or LOG_GROUP=${LOG_GROUP} doesn't match your deployed function name (check the 'environment' input matches what you deployed with)."
            exit 1
          else
            echo "::error::Expected exactly 1 invocation for ${RAW_KEY}, found ${MATCHES}. This indicates a retrigger loop."
            exit 1
          fi

      - name: "Comprehend: clean up test objects"
        if: always() && inputs.test_comprehend
        run: |
          aws s3 rm "s3://${BUCKET}/${RAW_KEY}" || true
          aws s3 rm "s3://${BUCKET}/${PROCESSED_KEY}" || true

      # ---------------------------------------------------------------------
      # Macie: upload an unredacted copy under a prefix the PII gateway does
      # not watch, run a scoped one-time classification job, and confirm it
      # reports findings.
      # ---------------------------------------------------------------------
      - name: "Macie: ensure fixture object exists"
        id: macie_fixture
        if: inputs.test_macie
        run: |
          # Macie maintains its own per-bucket object inventory that refreshes on
          # a daily cycle (see "Scope options for sensitive data discovery jobs"
          # in the Macie user guide), not in real time. A classification job
          # scoped to this bucket only sees objects already in that inventory.
          # A brand-new object created moments ago will show 0 classifiable
          # objects regardless of how long we sleep in this same run. So we use
          # one STABLE, persistent fixture key instead of a fresh key per run:
          # once it's been through Macie's inventory refresh (allow up to ~24h
          # after first upload), later runs keep scanning this same known
          # object and should complete reliably from then on. We deliberately
          # never re-upload/delete it, so its LastModified stays stable.
          MACIE_KEY="macie-test/pii_fixture.csv"
          echo "MACIE_KEY=${MACIE_KEY}" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          if aws s3api head-object --bucket "$BUCKET" --key "$MACIE_KEY" >/dev/null 2>&1; then
            echo "Fixture already exists at s3://${BUCKET}/${MACIE_KEY} - leaving it untouched."
            BUCKET_INFO=$(aws macie2 describe-buckets \
              --criteria "{\"bucketName\":{\"eq\":[\"${BUCKET}\"]}}" \
              --output json)
            CLASSIFIABLE_OBJECTS=$(echo "$BUCKET_INFO" | jq -r '.buckets[0].classifiableObjectCount // 0')
            if [ "$CLASSIFIABLE_OBJECTS" -gt 0 ]; then
              echo "Macie reports ${CLASSIFIABLE_OBJECTS} classifiable object(s) in ${BUCKET}."
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The fixture exists, but Macie has not added a classifiable object to its inventory yet."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              {
                echo "### Macie test pending"
                echo "The fixture exists, but Macie's S3 inventory has no classifiable objects for this bucket yet. Re-run after the inventory refresh, potentially within 24 hours."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Fixture didn't exist yet, uploading it now. Macie's inventory refresh can take up to ~24h before a classification job can see it. Run this workflow again after the fixture appears in Macie's bucket inventory."
            aws s3 cp terraform-modules/comprehend-PII-gateway/pii_test.csv "s3://${BUCKET}/${MACIE_KEY}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Macie test pending"
              echo "The fixture was uploaded during this run and is waiting for Macie's S3 inventory refresh. Re-run this workflow after the refresh, potentially within 24 hours."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Macie: run scoped one-time classification job"
        if: inputs.test_macie && steps.macie_fixture.outputs.ready == 'true'
        run: |
          JOB_DEF=$(jq -n --arg acct "$ACCOUNT_ID" --arg bucket "$BUCKET" '{
            bucketDefinitions: [{accountId: $acct, buckets: [$bucket]}],
            scoping: {includes: {and: [{simpleScopeTerm: {comparator: "STARTS_WITH", key: "OBJECT_KEY", values: ["macie-test/"]}}]}}
          }')
          JOB_ID=$(aws macie2 create-classification-job \
            --job-type ONE_TIME \
            --name "governance-test-${RUN_TAG}" \
            --s3-job-definition "$JOB_DEF" \
            --query jobId --output text)
          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "Started Macie classification job ${JOB_ID}"

      - name: "Macie: wait for job completion"
        if: inputs.test_macie && steps.macie_fixture.outputs.ready == 'true'
        run: |
          # The first classification job in a new account/region can take well over
          # 10 minutes while AWS provisions the Macie scanning backend; later runs
          # are typically much faster. 100 attempts * 15s = up to 25 minutes.
          for attempt in $(seq 1 100); do
            STATUS=$(aws macie2 describe-classification-job --job-id "$JOB_ID" --query jobStatus --output text)
            echo "Attempt ${attempt}: job status is ${STATUS}"
            if [ "$STATUS" = "COMPLETE" ]; then
              exit 0
            fi
            if [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "USER_PAUSED" ]; then
              echo "::error::Classification job ended in unexpected status ${STATUS}"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for Macie job ${JOB_ID} to complete."
          exit 1

      - name: "Macie: inspect job run details"
        if: inputs.test_macie && steps.macie_fixture.outputs.ready == 'true'
        run: |
          aws macie2 describe-classification-job --job-id "$JOB_ID" --output json | tee job_details.json
          echo "--- summary ---"
          echo "lastRunErrorStatus: $(jq -r '.lastRunErrorStatus.code // "UNKNOWN"' job_details.json)"
          echo "statistics: $(jq -c '.statistics // {}' job_details.json)"
          echo "--- object being scanned ---"
          aws s3api head-object --bucket "$BUCKET" --key "$MACIE_KEY" --output json || echo "::warning::Could not head-object $MACIE_KEY"
          # Note: statistics.approximateNumberOfObjectsToProcess is REMAINING work
          # for the current run, not a total-scanned count - it is always 0 once
          # jobStatus is COMPLETE, whether or not anything was actually found. It
          # is not useful as a pass/fail signal here, so we don't gate on it.

      - name: "Macie: verify findings were reported"
        if: inputs.test_macie && steps.macie_fixture.outputs.ready == 'true'
        run: |
          FINDING_CRITERIA=$(jq -n --arg jobid "$JOB_ID" '{criterion: {"classificationDetails.jobId": {eq: [$jobid]}}}')
          FINDING_IDS=""
          # Findings can take a few minutes to be published even after the job
          # itself reports COMPLETE, so poll rather than checking once.
          for attempt in $(seq 1 20); do
            FINDING_IDS=$(aws macie2 list-findings \
              --finding-criteria "$FINDING_CRITERIA" \
              --query 'findingIds' --output text)
            echo "Attempt ${attempt}: findings so far: ${FINDING_IDS:-<none>}"
            if [ -n "$FINDING_IDS" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "$FINDING_IDS" ]; then
            echo "::error::No Macie findings were reported for job ${JOB_ID} after polling. Confirm that Macie reports the target bucket as classifiable and that macie-test/pii_fixture.csv was present before the inventory refresh. If the fixture was uploaded recently, wait for the inventory refresh and re-run this workflow."
            exit 1
          fi
          echo "PASS: Macie reported findings: ${FINDING_IDS}"
          aws macie2 get-findings --finding-ids $FINDING_IDS \
            --query 'findings[].{Type:type,Severity:severity.description,Bucket:resourcesAffected.s3Bucket.name}' \
            --output table

      # No cleanup step for the Macie fixture: it's intentionally left in place
      # (s3://<bucket>/macie-test/pii_fixture.csv) so it stays in Macie's
      # inventory and future runs don't have to wait through another
      # inventory-refresh cycle. If you need to remove it, use the "Empty S3
      # Bucket" workflow or delete it manually.
