name: Deploy S3

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview changes (plan) or deploy them (apply)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-s3-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Terraform S3 (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: terraform-modules/s3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show target AWS account
        run: aws sts get-caller-identity

      - name: Check existing state bucket
        run: aws s3api head-bucket --bucket wezvatech-s3-2026-tfstate

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Plan S3 changes
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: Apply S3 changes
        if: inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Show deployed bucket ARNs
        if: inputs.action == 'apply'
        run: terraform output -no-color deployed_infrastructure_storage_arns
