name: IAC Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview (plan), deploy (apply), or delete managed resources (destroy)
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  terraform-demo:
    name: Terraform demo (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run: 
        working-directory: terraform-modules/demo

    steps:
      # -------------------
      # demo Provision
      # -------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
              
      - name: config aws credential
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1 

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov Scan
        run: checkov -d . --soft-fail

      - name: terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: terraform destroy plan
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -no-color -lock-timeout=5m -out=destroy.tfplan

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform apply -input=false -no-color -lock-timeout=5m destroy.tfplan
