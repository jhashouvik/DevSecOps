apiVersion: v1
kind: ConfigMap
metadata:
  name: wezvaspringbootapp
  namespace: demo
data:
   application.properties.orig: |

        logging.level.org.springframework=INFO
        logging.level.com.mkyong=INFO
        logging.level.com.zaxxer=ERROR
        logging.level.root=ERROR

        # Enable the Spring Boot Actuator endpoint over HTTP & Prometheus
        management.endpoints.web.exposure.include=*
        management.endpoints.web.exposure.exclude=

        # Enable healthcheck probes for kubernetes
        management.endpoint.health.probes.enabled=true

        spring.datasource.hikari.connectionTimeout=20000
        spring.datasource.hikari.maximumPoolSize=5

        # logging.pattern.console=%-5level %logger{36} - %msg%n

        # hibernate_sequence' doesn't exist
        # spring.jpa.hibernate.use-new-id-generator-mappings=false

        # drop n create table again, good for testing, comment this in production
        spring.jpa.hibernate.ddl-auto=create-drop
        
        ## ===================================================================
        ## MySQL
        ## ===================================================================
        spring.datasource.url=jdbc:mysql://mysql-svc/mywezvadb

        spring.datasource.username=${DB_USER}
        spring.datasource.password=${DB_PASSWORD}

        ## ===================================================================
        ## AWS MSK Kafka Configuration (Via Transit Gateway)
        ## ===================================================================
        # This will read the comma-separated MSK string from your Deployment YAML
        spring.kafka.bootstrap-servers=${MSK_BOOTSTRAP_SERVERS}

        # Consumer settings
        spring.kafka.consumer.group-id=ledger-service-group
        spring.kafka.consumer.auto-offset-reset=earliest
        spring.kafka.consumer.properties.spring.json.trusted.packages=*

        # Producer settings
        spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
        spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

        ## ===================================================================
        ## AWS S3 Configuration (Ledger Receipts & JSON Payloads)
        ## ===================================================================
        # The region where your S3 bucket resides (e.g., us-east-1)
        spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
        
        # Custom properties that your Spring code reads to target the bucket
        ledger.s3.bucket-name=${S3_BUCKET_NAME}


