apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wezvanodejsapp-hpa
spec:
  maxReplicas: 10
  minReplicas: 1
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: wezvanodejsapp
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 20 
