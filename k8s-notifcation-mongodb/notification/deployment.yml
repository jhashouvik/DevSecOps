kind: Rollout
apiVersion: argoproj.io/v1alpha1
metadata:
  name: wezvanodejsapp
  namespace: demo
  labels:
    app.kubernetes.io/name: wezvanodejsapp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    canary:
      # No trafficRouting object here! Kafka handles the shift via group rebalancing.
      steps:
        - setWeight: 50   # 20% of pods upgrade, triggering a Kafka partition rebalance
        - pause:
            duration: 30s  # Watch consumer lag and processing errors
        - setWeight: 100
  selector:
    matchLabels:
      app.kubernetes.io/name: wezvanodejsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wezvanodejsapp
    spec:
     serviceAccountName: wezvatech-admin
     imagePullSecrets:
       - name: ecr-secret
     initContainers:
       - name: init-mydb
         image: mongo:8
         env:
           - name: MONGODB_USERNAME
             valueFrom:
               secretKeyRef:
                 name: database-secret
                 key: username
           - name: MONGODB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: database-secret
                 key: password
           - name: MONGODB_HOST
             valueFrom:
               configMapKeyRef:
                 name: wezvanodejscm
                 key: mongodb_host
         command:
         - sh
         - -c
         - |
           until mongosh "mongodb+srv://$(MONGODB_USERNAME):$(MONGODB_PASSWORD)@$(MONGODB_HOST)/$(mongodb_database)" \
             --eval "db.adminCommand({ ping: 1 })"; do
             echo "waiting for mongodb"
             sleep 5
           done
         resources:
           limits:
             cpu: 400m
             memory: 500Mi
           requests:
             cpu: 100m
             memory: 128Mi
     containers:
       - name: main
         image: 081654307023.dkr.ecr.ap-south-1.amazonaws.com/wezvatechnotification:rel48
         imagePullPolicy: IfNotPresent
         lifecycle:
           preStop:
             exec:
               command: ["/bin/sh", "-c", "sleep 15"] # Gives Kafka client time to stop pulling new messages
         env:
           - name: KAFKA_BROKERS
             valueFrom:
               configMapKeyRef:
                 name: wezvanodejscm
                 key: kafka_brokers
           - name: KAFKA_TOPIC
             valueFrom:
               configMapKeyRef:
                 name: wezvanodejscm
                 key: kafka_topic
           - name: KAFKA_CONSUMER_Group
             valueFrom:
               configMapKeyRef:
                name: wezvanodejscm
                key: kafka_consumer_group
           - name: MONGODB_HOST
             valueFrom:
               configMapKeyRef:
                 name: wezvanodejscm
                 key: mongodb_host
           - name: MONGODB_DATABASE
             valueFrom:
               configMapKeyRef:
                 name: wezvanodejscm
                 key: mongodb_database
           - name: MONGODB_USERNAME
             valueFrom:
               secretKeyRef:
                 name: database-secret
                 key: username
           - name: MONGODB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: database-secret
                 key: password
         ports:
           - containerPort: 3000
         livenessProbe:
           httpGet:
              path: /live
              port: 3000
           initialDelaySeconds: 30
           periodSeconds:  45 
           timeoutSeconds:  5
         readinessProbe:
           httpGet:
              path: /ready
              port: 3000
           initialDelaySeconds: 30
           timeoutSeconds:  5
           periodSeconds: 5
         resources:
            limits: 
              cpu: 400m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
         volumeMounts:
           - name: tls-volume
             mountPath: /etc/tls
             readOnly: true
     volumes:
     - name: tls-volume
       secret:
         secretName: database-ssl-secret
